<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Меню</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }

      .ar-screen {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #000;
        color: white;
        z-index: 999;
        flex-direction: column;
      }

      .error-banner {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0;
        background: #b71c1c;
        color: white;
        padding: 10px;
        font-size: 13px;
        z-index: 1003;
        text-align: center;
      }

      /* Галерея */
      .gallery-wrap { height: 60%; position: relative; }
      .gallery {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        height: 100%;
        -webkit-overflow-scrolling: touch;
      }
      .gallery img {
        flex: 0 0 100%;
        width: 100%;
        height: 100%;
        object-fit: cover;
        scroll-snap-align: start;
      }
      .gallery-dots {
        position: absolute;
        bottom: 12px; left: 0; right: 0;
        display: flex; justify-content: center; gap: 6px;
      }
      .gallery-dots span {
        width: 8px; height: 8px; border-radius: 50%;
        background: rgba(255,255,255,0.4);
      }
      .gallery-dots span.active { background: white; }
      .bar-title-overlay {
        position: absolute;
        top: 16px; left: 16px;
        font-size: 22px; font-weight: bold;
        text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      }

      /* Меню списком, со скроллом */
      .menu-list-wrap {
        height: 40%;
        background: #111;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 10px 16px;
        box-sizing: border-box;
      }
      .menu-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 0;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .menu-row .name { font-size: 16px; }
      .menu-row .price { font-size: 15px; color: #9fd3c7; font-weight: bold; }

      .exit-btn {
        position: fixed;
        top: 16px; right: 16px;
        z-index: 1001;
        background: rgba(0,0,0,0.6);
        border-radius: 50%;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px;
      }

      /* Экран детали напитка */
      .detail-screen {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #111;
        color: white;
        z-index: 1002;
        overflow-y: auto;
      }
      .detail-screen img {
        width: 100%;
        height: 45vh;
        object-fit: cover;
      }
      .detail-body { padding: 20px; }
      .detail-body h2 { margin-bottom: 4px; }
      .detail-meta {
        display: flex; gap: 16px;
        color: #9fd3c7;
        margin-bottom: 14px;
        font-size: 15px;
      }
      .back-btn {
        position: fixed;
        top: 16px; left: 16px;
        z-index: 1003;
        background: rgba(0,0,0,0.6);
        border-radius: 50%;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px;
      }
    </style>
  </head>
  
  <body>

    <div class="error-banner" id="error-banner"></div>

    <div id="screen-menu" class="ar-screen">
      <div class="exit-btn" onclick="exitMenu()">✕</div>

      <div class="gallery-wrap">
        <div class="bar-title-overlay" id="bar-title"></div>
        <div class="gallery" id="gallery"></div>
        <div class="gallery-dots" id="gallery-dots"></div>
      </div>

      <div class="menu-list-wrap" id="menu-list"></div>
    </div>

    <div class="detail-screen" id="detail-screen">
      <div class="back-btn" onclick="closeDetail()">←</div>
      <img id="detail-image" src="">
      <div class="detail-body">
        <h2 id="detail-name"></h2>
        <div class="detail-meta">
          <span id="detail-price"></span>
          <span id="detail-abv"></span>
        </div>
        <p id="detail-desc"></p>
      </div>
    </div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: ./mind/targets.mind; missTolerance: 1000000;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>
      <a-entity id="target-2" mindar-image-target="targetIndex: 2"></a-entity>
    </a-scene>

    <script>
      const BAR_MENUS = {
        0: "./menus/bar1.json",
        1: "./menus/bar2.json",
        2: "./menus/bar3.json"
      };

      let autoplayTimer = null;
      let autoplayPausedTimer = null;

      function showError(msg) {
        const banner = document.getElementById('error-banner');
        banner.innerText = msg;
        banner.style.display = 'block';
        console.log(msg);
      }

      function onTargetFound(index) {
        fetch(BAR_MENUS[index])
          .then(res => {
            if (!res.ok) throw new Error('Файл меню не найден: ' + BAR_MENUS[index] + ' (код ' + res.status + ')');
            return res.json();
          })
          .then(data => buildMenuScreen(data))
          .catch(err => {
            showError('Ошибка загрузки меню: ' + err.message);
            const arSystem = document.querySelector('#ar-scene').systems["mindar-image-system"];
            arSystem.pause();
          });
      }

      Object.keys(BAR_MENUS).forEach(index => {
        document.getElementById('target-' + index)
          .addEventListener('targetFound', () => onTargetFound(index));
      });

      function buildMenuScreen(data) {
        document.getElementById('bar-title').innerText = data.barName || '';

        const photos = data.photos || [];
        const items = data.items || [];
        window.currentItems = items;

        // Галерея
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = photos.map(src => `<img src="${src}">`).join('');

        const dotsWrap = document.getElementById('gallery-dots');
        dotsWrap.innerHTML = photos.map((_, i) =>
          `<span class="${i === 0 ? 'active' : ''}"></span>`
        ).join('');

        gallery.onscroll = () => {
          const idx = Math.round(gallery.scrollLeft / gallery.clientWidth);
          [...dotsWrap.children].forEach((dot, i) => dot.classList.toggle('active', i === idx));
        };

        // Ручной свайп ставит автопрокрутку на паузу на 4 секунды
        gallery.addEventListener('touchstart', () => {
          clearInterval(autoplayTimer);
          clearTimeout(autoplayPausedTimer);
          autoplayPausedTimer = setTimeout(() => startAutoplay(gallery, photos.length), 4000);
        });

        startAutoplay(gallery, photos.length);

        // Меню списком
        const menuList = document.getElementById('menu-list');
        menuList.innerHTML = items.map((item, i) => `
          <div class="menu-row" onclick="openDetail(${i})">
            <span class="name">${item.name}</span>
            <span class="price">${item.price || ''}</span>
          </div>
        `).join('');

        document.getElementById('screen-menu').style.display = 'flex';
        const arSystem = document.querySelector('#ar-scene').systems["mindar-image-system"];
        arSystem.pause();
      }

      function startAutoplay(gallery, count) {
        clearInterval(autoplayTimer);
        if (count <= 1) return;
        let current = Math.round(gallery.scrollLeft / gallery.clientWidth);
        autoplayTimer = setInterval(() => {
          current = (current + 1) % count;
          gallery.scrollTo({ left: current * gallery.clientWidth, behavior: 'smooth' });
        }, 3000);
      }

      function openDetail(index) {
        const item = window.currentItems[index];
        document.getElementById('detail-image').src = item.image || '';
        document.getElementById('detail-name').innerText = item.name;
        document.getElementById('detail-price').innerText = item.price || '';
        document.getElementById('detail-abv').innerText = item.abv ? item.abv + ' алк.' : '';
        document.getElementById('detail-desc').innerText = item.desc || '';
        document.getElementById('detail-screen').style.display = 'block';
      }

      function closeDetail() {
        document.getElementById('detail-screen').style.display = 'none';
      }

      function exitMenu() {
        location.reload();
      }
    </script>
  </body>
</html>
