<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Меню</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      .ar-screen {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.9);
        color: white;
        font-family: sans-serif;
        z-index: 999;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      .menu-item {
        padding: 14px;
        margin: 8px 0;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
      }
      .back-btn {
        display: inline-block;
        padding: 10px 18px;
        background: #444;
        border-radius: 8px;
        margin-top: 12px;
      }
      #menu-open-btn {
        display: none;
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 12px 24px;
        background: rgba(0,0,0,0.8);
        color: white;
        border-radius: 30px;
        font-family: sans-serif;
        z-index: 998;
      }
    </style>
  </head>
  
  <body style="margin: 0px; overflow: hidden;">

    <div id="menu-open-btn" onclick="showScreen('menu')">📋 Меню</div>

    <div id="screen-menu" class="ar-screen">
      <h2 id="bar-title"></h2>
      <div id="menu-items"></div>
      <div class="back-btn" onclick="hideAllScreens()">Закрыть</div>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./mind/bar1-targets.mind; missTolerance: 1000000;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
      // Единственное, что меняется под каждый бар — это имя JSON-файла
      const MENU_FILE = "./menus/bar1.json";

      let menuData = null;

      fetch(MENU_FILE)
        .then(res => res.json())
        .then(data => {
          menuData = data;
          document.getElementById('bar-title').innerText = data.barName;
          const itemsHtml = data.items.map(item =>
            `<div class="menu-item"><b>${item.name}</b><br>${item.desc}</div>`
          ).join('');
          document.getElementById('menu-items').innerHTML = itemsHtml;
        });

      document.querySelector('#target').addEventListener('targetFound', () => {
        document.getElementById('menu-open-btn').style.display = 'block';
      });

      function showScreen(id) {
        document.getElementById('screen-' + id).style.display = 'block';
      }

      function hideAllScreens() {
        document.querySelectorAll('.ar-screen').forEach(el => el.style.display = 'none');
      }
    </script>
  </body>
</html>
