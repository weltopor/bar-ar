<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Меню</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; font-family: sans-serif; }

      .ar-screen {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #000;
        color: white;
        z-index: 999;
        flex-direction: column;
      }

      .gallery-wrap {
        height: 66%;
        position: relative;
      }
      .gallery {
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        height: 100%;
        -webkit-overflow-scrolling: touch;
      }
      .gallery img {
        flex: 0 0 100%;
        width: 100%;
        height: 100%;
        object-fit: cover;
        scroll-snap-align: start;
      }
      .gallery-dots {
        position: absolute;
        bottom: 12px;
        left: 0; right: 0;
        display: flex;
        justify-content: center;
        gap: 6px;
      }
      .gallery-dots span {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: rgba(255,255,255,0.4);
      }
      .gallery-dots span.active {
        background: white;
      }
      .bar-title-overlay {
        position: absolute;
        top: 16px; left: 16px;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      }

      .menu-strip-wrap {
        height: 34%;
        background: linear-gradient(180deg, #111, #000);
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
      }
      .menu-strip {
        display: flex;
        gap: 14px;
        white-space: nowrap;
        animation: scroll-left 18s linear infinite;
        padding-left: 20px;
      }
      .menu-strip:hover,
      .menu-strip.paused {
        animation-play-state: paused;
      }
      @keyframes scroll-left {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }
      .menu-card {
        flex: 0 0 auto;
        background: rgba(255,255,255,0.1);
        border-radius: 14px;
        padding: 14px 18px;
        min-width: 140px;
      }
      .menu-card b { font-size: 15px; }

      .exit-btn {
        position: fixed;
        top: 16px; right: 16px;
        z-index: 1001;
        background: rgba(0,0,0,0.6);
        border-radius: 50%;
        width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px;
      }

      .item-popup {
        display: none;
        position: fixed;
        left: 0; right: 0; bottom: 0;
        background: #16213e;
        color: white;
        z-index: 1002;
        padding: 20px;
        border-radius: 20px 20px 0 0;
        box-sizing: border-box;
      }
      .item-popup .close-popup {
        margin-top: 12px;
        display: inline-block;
        background: #444;
        padding: 8px 16px;
        border-radius: 8px;
      }

      /* Показывается, если что-то пошло не так с загрузкой JSON */
      .error-banner {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0;
        background: #b71c1c;
        color: white;
        padding: 10px;
        font-size: 13px;
        z-index: 1003;
        text-align: center;
      }
    </style>
  </head>
  
  <body>

    <div class="error-banner" id="error-banner"></div>

    <div id="screen-menu" class="ar-screen">
      <div class="exit-btn" onclick="exitMenu()">✕</div>

      <div class="gallery-wrap">
        <div class="bar-title-overlay" id="bar-title"></div>
        <div class="gallery" id="gallery"></div>
        <div class="gallery-dots" id="gallery-dots"></div>
      </div>

      <div class="menu-strip-wrap">
        <div class="menu-strip" id="menu-strip"></div>
      </div>

      <div class="item-popup" id="item-popup">
        <h3 id="popup-title"></h3>
        <p id="popup-desc"></p>
        <div class="close-popup" onclick="closePopup()">Закрыть</div>
      </div>
    </div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: ./mind/targets.mind; missTolerance: 1000000;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>
      <a-entity id="target-2" mindar-image-target="targetIndex: 2"></a-entity>
    </a-scene>

    <script>
      const BAR_MENUS = {
        0: "./menus/bar1.json",
        1: "./menus/bar2.json",
        2: "./menus/bar3.json"
      };

      function showError(msg) {
        const banner = document.getElementById('error-banner');
        banner.innerText = msg;
        banner.style.display = 'block';
        console.log(msg);
      }

      function onTargetFound(index) {
        fetch(BAR_MENUS[index])
          .then(res => {
            if (!res.ok) throw new Error('Файл меню не найден: ' + BAR_MENUS[index] + ' (код ' + res.status + ')');
            return res.json();
          })
          .then(data => buildMenuScreen(data))
          .catch(err => {
            showError('Ошибка загрузки меню: ' + err.message);
            // Даже при ошибке ставим камеру на паузу, чтобы не было ощущения "зависания"
            const arSystem = document.querySelector('#ar-scene').systems["mindar-image-system"];
            arSystem.pause();
          });
      }

      Object.keys(BAR_MENUS).forEach(index => {
        document.getElementById('target-' + index)
          .addEventListener('targetFound', () => onTargetFound(index));
      });

      function buildMenuScreen(data) {
        document.getElementById('bar-title').innerText = data.barName || 'Без названия';

        // Защита: если photos/items отсутствуют в JSON — не падаем, просто показываем пусто
        const photos = data.photos || [];
        const items = data.items || [];

        const gallery = document.getElementById('gallery');
        gallery.innerHTML = photos.map(src => `<img src="${src}">`).join('');

        const dotsWrap = document.getElementById('gallery-dots');
        dotsWrap.innerHTML = photos.map((_, i) =>
          `<span class="${i === 0 ? 'active' : ''}"></span>`
        ).join('');

        gallery.onscroll = () => {
          const index = Math.round(gallery.scrollLeft / gallery.clientWidth);
          [...dotsWrap.children].forEach((dot, i) =>
            dot.classList.toggle('active', i === index)
          );
        };

        const strip = document.getElementById('menu-strip');
        const cardsHtml = items.map((item, i) =>
          `<div class="menu-card" onclick="openPopup(${i})"><b>${item.name}</b></div>`
        ).join('');
        strip.innerHTML = cardsHtml + cardsHtml;

        window.currentItems = items;

        document.getElementById('screen-menu').style.display = 'flex';
        const arSystem = document.querySelector('#ar-scene').systems["mindar-image-system"];
        arSystem.pause();
      }

      function openPopup(index) {
        const item = window.currentItems[index];
        document.getElementById('popup-title').innerText = item.name;
        document.getElementById('popup-desc').innerText = item.desc;
        document.getElementById('item-popup').style.display = 'block';
        document.getElementById('menu-strip').classList.add('paused');
      }

      function closePopup() {
        document.getElementById('item-popup').style.display = 'none';
        document.getElementById('menu-strip').classList.remove('paused');
      }

      function exitMenu() {
        location.reload();
      }
    </script>
  </body>
</html>
