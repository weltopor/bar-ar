<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AR Меню</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }

      .ar-screen {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(135deg, #1a1a2e, #16213e);
        color: white;
        font-family: sans-serif;
        z-index: 999;
        padding: 20px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      .menu-item {
        padding: 14px;
        margin: 8px 0;
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
      }
      .exit-btn {
        display: inline-block;
        padding: 10px 18px;
        background: #444;
        border-radius: 8px;
        margin-top: 16px;
      }
    </style>
  </head>
  
  <body>

    <div id="screen-menu" class="ar-screen">
      <h2 id="bar-title"></h2>
      <div id="menu-items"></div>
      <div class="exit-btn" onclick="exitMenu()">✕ Выйти и сканировать другое место</div>
    </div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: ./mind/targets.mind; missTolerance: 1000000;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target-0" mindar-image-target="targetIndex: 0"></a-entity>
      <a-entity id="target-1" mindar-image-target="targetIndex: 1"></a-entity>
      <a-entity id="target-2" mindar-image-target="targetIndex: 2"></a-entity>
    </a-scene>

    <script>
      const BAR_MENUS = {
        0: "./menus/bar1.json",
        1: "./menus/bar2.json",
        2: "./menus/bar3.json"
      };

      function onTargetFound(index) {
        fetch(BAR_MENUS[index])
          .then(res => res.json())
          .then(data => {
            document.getElementById('bar-title').innerText = data.barName;
            const itemsHtml = data.items.map(item =>
              `<div class="menu-item"><b>${item.name}</b><br>${item.desc}</div>`
            ).join('');
            document.getElementById('menu-items').innerHTML = itemsHtml;
            showMenuAndPauseCamera();
          })
          .catch(err => console.log('Ошибка загрузки меню:', err));
      }

      Object.keys(BAR_MENUS).forEach(index => {
        document.getElementById('target-' + index)
          .addEventListener('targetFound', () => onTargetFound(index));
      });

      function showMenuAndPauseCamera() {
        document.getElementById('screen-menu').style.display = 'block';
        const arSystem = document.querySelector('#ar-scene').systems["mindar-image-system"];
        arSystem.pause();
      }

      function exitMenu() {
        location.reload();
      }
    </script>
  </body>
</html>
