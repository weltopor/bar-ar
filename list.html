<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Бары Кобленца — карта</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      body, html { margin: 0; padding: 0; height: 100%; }
      #map { width: 100%; height: 100%; }

      .popup-card {
        text-align: center;
        font-family: sans-serif;
      }
      .popup-card img {
        width: 100%;
        max-width: 180px;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 6px;
      }
      .popup-card .name {
        font-weight: bold;
        margin-bottom: 6px;
      }
      .popup-card a {
        display: inline-block;
        background: #1a1a2e;
        color: white;
        padding: 8px 14px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      const map = L.map('map').setView([50.3569, 7.5890], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      fetch('./bars.json')
        .then(res => res.json())
        .then(bars => {
          bars.forEach(bar => {
            const marker = L.marker([bar.lat, bar.lng]).addTo(map);
            marker.bindPopup(`
              <div class="popup-card">
                <img src="${bar.cover}">
                <div class="name">${bar.name}</div>
                <a href="./ar.html?bar=${bar.id}">Сканировать →</a>
              </div>
            `);
          });
        })
        .catch(err => console.log('Ошибка загрузки списка баров:', err));
    </script>
  </body>
</html>
