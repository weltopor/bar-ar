<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Бары Кобленца — карта</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      body, html { margin: 0; padding: 0; height: 100%; }
      #map { width: 100%; height: 100%; }

      .popup-card {
        text-align: center;
        font-family: sans-serif;
      }
      .popup-card img {
        width: 100%;
        max-width: 180px;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 6px;
      }
      .popup-card .name {
        font-weight: bold;
        margin-bottom: 6px;
      }
      .popup-card a {
        display: inline-block;
        background: #1a1a2e;
        color: white;
        padding: 8px 14px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
      }

      /* Делаем подпись OpenStreetMap максимально незаметной, но не убираем совсем (обязательное требование лицензии) */
      .leaflet-control-attribution {
        font-size: 8px !important;
        opacity: 0.4;
        background: transparent !important;
        padding: 2px 4px !important;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      // Стартуем с примерного центра города, потом попробуем уточнить по геолокации
      const map = L.map('map').setView([50.3569, 7.5890], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Пытаемся определить реальное местоположение пользователя
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const userLat = pos.coords.latitude;
            const userLng = pos.coords.longitude;
            map.setView([userLat, userLng], 17); // 17 — крупный приближенный вид

            // Маркер "ты здесь"
            L.circleMarker([userLat, userLng], {
              radius: 8,
              fillColor: '#4285F4',
              fillOpacity: 1,
              color: 'white',
              weight: 2
            }).addTo(map).bindPopup('Ты здесь');
          },
          (err) => {
            console.log('Геолокация недоступна:', err.message);
            // Если пользователь не разрешил доступ — остаёмся на стандартном центре города
          }
        );
      }

      fetch('./bars.json')
        .then(res => res.json())
        .then(bars => {
          bars.forEach(bar => {
            const marker = L.marker([bar.lat, bar.lng]).addTo(map);
            marker.bindPopup(`
              <div class="popup-card">
                <img src="${bar.cover}">
                <div class="name">${bar.name}</div>
                <a href="./ar.html?bar=${bar.id}">Сканировать →</a>
              </div>
            `);
          });
        })
        .catch(err => console.log('Ошибка загрузки списка баров:', err));
    </script>
  </body>
</html>
