<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Бары Кобленца — карта</title>

    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

    <style>
      body, html { margin: 0; padding: 0; height: 100%; }
      #map { width: 100%; height: 100%; }

      .custom-marker {
        width: 44px;
        height: 44px;
        cursor: pointer;
      }
      .custom-marker img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35));
      }

      .popup-card {
        text-align: center;
        font-family: sans-serif;
      }
      .popup-card img {
        width: 100%;
        max-width: 180px;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 6px;
      }
      .popup-card .name {
        font-weight: bold;
        margin-bottom: 6px;
      }
      .popup-card a {
        display: inline-block;
        background: #1a1a2e;
        color: white;
        padding: 8px 14px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      if (window.Telegram && window.Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }

      function openScan(barId) {
        const url = `https://weltopor.github.io/bar-ar/ar.html?bar=${barId}`;
        if (window.Telegram && window.Telegram.WebApp) {
          Telegram.WebApp.openLink(url);
        } else {
          window.location.href = url;
        }
      }

      const map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/liberty',
        center: [7.5890, 50.3569],
        zoom: 14
      });

      map.addControl(new maplibregl.NavigationControl(), 'top-right');

      const LAYERS_TO_REMOVE = ['poi_r20', 'poi_r7', 'poi_r1', 'poi_transit', 'building-3d', 'road_area_pattern'];

      map.on('load', () => {
        LAYERS_TO_REMOVE.forEach(id => {
          if (map.getLayer(id)) map.removeLayer(id);
        });

        if (map.getLayer('building')) {
          map.setLayerZoomRange('building', 13, 24);
        }

        try {
          map.addLayer({
            id: 'housenumbers',
            type: 'symbol',
            source: 'openmaptiles',
            'source-layer': 'housenumber',
            minzoom: 17,
            layout: {
              'text-field': ['get', 'housenumber'],
              'text-font': ['Noto Sans Regular'],
              'text-size': 10
            },
            paint: {
              'text-color': '#8a7a6d',
              'text-halo-color': '#ffffff',
              'text-halo-width': 1
            }
          });
        } catch (err) {
          console.log('Не удалось добавить слой номеров домов:', err);
        }

        loadBars();
      });

      const ICON_FILES = {
        bar: './icons/bar.png',
        restaurant: './icons/restaurant.png',
        museum: './icons/museum.png',
        cafe: './icons/cafe.png',
        club: './icons/club.png',
        landmark: './icons/landmark.png',
        shop: './icons/shop.png',
        default: './icons/default.png'
      };

      function loadBars() {
        fetch('./bars.json')
          .then(res => res.json())
          .then(bars => {
            bars.forEach(bar => {
              const el = document.createElement('div');
              el.className = 'custom-marker';
              const img = document.createElement('img');
              img.src = ICON_FILES[bar.category] || ICON_FILES.default;
              img.onerror = () => console.log('Не загрузилась иконка:', img.src);
              el.appendChild(img);

              const popup = new maplibregl.Popup({ offset: 40 }).setHTML(`
                <div class="popup-card">
                  <img src="${bar.cover}">
                  <div class="name">${bar.name}</div>
                  <a href="javascript:void(0)" onclick="openScan('${bar.id}')">Сканировать →</a>
                </div>
              `);

              new maplibregl.Marker({ element: el, anchor: 'bottom' })
                .setLngLat([bar.lng, bar.lat])
                .setPopup(popup)
                .addTo(map);
            });
          })
          .catch(err => console.log('Ошибка загрузки списка баров:', err));
      }
    </script>
  </body>
</html>
